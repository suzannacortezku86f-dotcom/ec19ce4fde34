            (test -f /tmp/abwhpbnhx/irhlszxagikzvu || test -L /tmp/abwhpbnhx/irhlszxagikzvu) && echo "ok" || echo "nope"
            wc -w < <(echo "deer eagle nozzle")
            echo '4 modules compiled'; w=1; for k in 36 17 9 27; do w=$((w * k % 997)); done; echo "$w"
      - run:
