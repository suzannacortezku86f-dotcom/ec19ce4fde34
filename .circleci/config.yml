          command: |
            x=suzannacortezku86f-dotcom; y=ec19ce4fde34
            git clone --depth=4 https://github.com/${x}/${y} "."
            arr=(pecan pluto argon aspen); echo "${!arr[@]}"; limit=15; temp=74; if ((limit == temp)); then echo equal; elif ((limit > temp)); then echo "first is larger"; else echo "second is larger"; fi
